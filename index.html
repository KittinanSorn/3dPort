<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Model: Project</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #1a1a1a;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      margin: 20px 0 30px 0;
      font-size: 2.2rem;
      font-weight: bold;
    }
    #canvas-container {
      width: 90%;
      max-width: 1000px;
      height: 550px;
      background-color: #333333;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      position: relative;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.2rem;
      color: #ffffff;
    }
  </style>
  <!-- โหลด Three.js, OrbitControls และ GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <h1>3D Model: Project</h1>
  
  <div id="canvas-container">
    <div id="loading">กำลังโหลดโมเดล 3D...</div>
  </div>

  <script>
    const container = document.getElementById('canvas-container');
    const loadingEl = document.getElementById('loading');

    // 1. Scene, Camera, Renderer
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x333333);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(15, 12, 18);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // 2. Orbit Controls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;



    // 4. Load bg1.glb จาก GitHub Repository ของคุณ
    const loader = new THREE.GLTFLoader();
    
    // ดึงไฟล์จาก Path ในโฟลเดอร์ 3dmodel
    const modelUrl = 'https://raw.githubusercontent.com/KittinanSorn/KittinanSorn.github.io/main/3dmodel/bg3.glb';

    loader.load(
      modelUrl, 
      function (gltf) {
        const model = gltf.scene;
        scene.add(model);
        loadingEl.style.display = 'none';

        // ปรับมุมกล้องและโฟกัสให้อยู่ตรงกลางโมเดลอัตโนมัติ
        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        controls.target.copy(center);
        controls.update();
      },
      function (xhr) {
        if (xhr.lengthComputable) {
          const percentComplete = Math.round((xhr.loaded / xhr.total) * 100);
          loadingEl.innerText = `กำลังโหลดโมเดล... ${percentComplete}%`;
        }
      },
      function (error) {
        console.error('เกิดข้อผิดพลาดในการโหลดโมเดล:', error);
        loadingEl.innerText = 'ไม่สามารถโหลดโมเดลได้';
      }
    );

    // 5. Render Loop & Resize
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
